name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: mkdir -p prebuilds/linux-x64 && cp build/Release/virtual_x360.node prebuilds/linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-files
          path: prebuilds/linux-x64/virtual_x360.node

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: microsoft/setup-msbuild@v2
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Build and package WinUHid
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\build-winuhid.ps1 `
            -InstallDriver:$false -SkipDeviceVerification
          if ($LASTEXITCODE -ne 0) {
            throw 'WinUHid build/package step failed.'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\stage-native.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'Native addon staging failed.'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\verify-build.ps1
          if ($LASTEXITCODE -ne 0) {
            throw 'Build verification failed.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-files
          path: |
            prebuilds/win32-x64/virtual_x360.node
            vendor/WinUHid/bin/win32-x64/*.dll
            vendor/WinUHid/package/WinUHidDriver.dll
            vendor/WinUHid/package/WinUHidDriver.inf
            vendor/WinUHid/package/winuhiddriver.cat

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: linux-package-files
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: windows-package-files
          path: .
      - run: npm install --ignore-scripts
      - run: npm run pack:check
      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Skip publish without npm token
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; package verification completed without publishing."
