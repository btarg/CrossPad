name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: mkdir -p prebuilds/linux-x64 && cp build/Release/virtual_x360.node prebuilds/linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-files
          path: prebuilds/linux-x64/virtual_x360.node

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Build WinUHid user libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $installPath = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath).Trim()
          if (-not $installPath) {
            throw 'A Visual Studio installation with MSBuild was not found.'
          }

          $msbuild = Join-Path $installPath 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild was not found at $msbuild"
          }

          $projects = @(
            @{
              Name = 'WinUHid'
              Path = 'vendor\WinUHid\WinUHid\WinUHid.vcxproj'
              Output = 'vendor\WinUHid\WinUHid\build\Release\x64\WinUHid.dll'
            },
            @{
              Name = 'WinUHidDevs'
              Path = 'vendor\WinUHid\WinUHidDevs\WinUHidDevs.vcxproj'
              Output = 'vendor\WinUHid\WinUHidDevs\build\Release\x64\WinUHidDevs.dll'
            }
          )

          foreach ($project in $projects) {
            if (-not (Test-Path -LiteralPath $project.Path)) {
              throw "$($project.Name) project was not found at $($project.Path)"
            }

            & $msbuild $project.Path /p:Configuration=Release /p:Platform=x64 /m
            if ($LASTEXITCODE -ne 0) {
              throw "$($project.Name) build failed."
            }

            if (-not (Test-Path -LiteralPath $project.Output)) {
              throw "$($project.Name) build did not produce $($project.Output)"
            }
          }

          New-Item -ItemType Directory -Force -Path 'prebuilds\win32-x64', 'vendor\WinUHid\bin\win32-x64' | Out-Null
          Copy-Item -LiteralPath 'build\Release\virtual_x360.node' -Destination 'prebuilds\win32-x64\' -Force
          Copy-Item -LiteralPath $projects[0].Output -Destination 'vendor\WinUHid\bin\win32-x64\WinUHid.dll' -Force
          Copy-Item -LiteralPath $projects[1].Output -Destination 'vendor\WinUHid\bin\win32-x64\WinUHidDevs.dll' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-files
          path: |
            prebuilds/win32-x64/virtual_x360.node
            vendor/WinUHid/bin/win32-x64/*.dll

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: linux-package-files
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: windows-package-files
          path: .
      - run: npm install --ignore-scripts
      - run: npm run pack:check
      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
